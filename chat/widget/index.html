<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente Centro de FP Ejemplo Norte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="chat">
    <header id="chat-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">N</span>
        <div class="brand-text">
          <span class="brand-title">Asistente Centro de FP Ejemplo Norte</span>
          <span class="brand-status" id="status">En línea</span>
        </div>
      </div>
      <button id="theme-toggle" type="button" aria-label="Cambiar tema" title="Cambiar tema claro/oscuro">
        <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </header>

    <div id="messages" aria-live="polite"></div>

    <form id="composer" autocomplete="off">
      <input id="input" type="text" autocomplete="off"
             placeholder="Escribe tu pregunta..." required
             aria-label="Escribe tu pregunta">
      <button type="submit" id="send-btn" aria-label="Enviar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </form>
  </div>
  <script src="chat.js"></script>
</body>
</html>
