server {
    listen 444 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;

    # Widget estático
    location / {
        root /usr/share/nginx/chat;
        index index.html;
    }

    # API: chat (SSE) + history. Anclado para NO capturar /chat.js, /style.css, etc.
    # (/chat es exacto; /history/ es prefijo). Si no, /chat.js iría a FastAPI → 404.
    location ~ ^/(chat$|history/) {
        proxy_pass http://secretaria-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
