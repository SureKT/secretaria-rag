services:
  # 1. PostgreSQL: conversaciones y mensajes de la API de chat.
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # 2. Ollama corre nativamente en el host (fuera de Docker).
  #    Accesible desde los contenedores en http://host.docker.internal:11434

  # 3. Qdrant: índice vectorial del RAG, colección `secretaria`.
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  # 4. API de chat con streaming (FastAPI). Una instancia sirve a un centro: TENANT.
  #    El código se copia en la imagen; tras un cambio: docker compose up -d --build secretaria-api
  secretaria-api:
    build: ./chat
    container_name: secretaria_api
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=secretaria
      - TENANT=${TENANT:-norte}
      - EMBED_MODEL=mxbai-embed-large:latest
      - LLM_MODEL=${LLM_MODEL:-llama3.1:8b}
      - RETRIEVAL_LIMIT=12
      - NUM_PREDICT=450
      - HISTORY_TURNS=6
      - EMBED_QUERY_TURNS=3
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - qdrant
    restart: always

  # 5. nginx: sirve el widget de chat y hace de proxy SSE hacia la API (nginx/chat.conf).
  nginx-viewer:
    image: nginx:alpine
    container_name: nginx_viewer
    ports:
      - "3444:444"
    volumes:
      - ./nginx/chat.conf:/etc/nginx/conf.d/chat.conf:ro
      - ./chat/widget:/usr/share/nginx/chat:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - secretaria-api
    restart: always

volumes:
  postgres_data:
  qdrant_data:
